<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>學員教練專區 - NEAT</title>
  <meta name="description" content="您的專屬訓練菜單與週期規劃。" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>" />
</head>
<body>
<div id="app">

  <!-- ==========================================
       SPLASH SCREEN (LOGIN)
  =========================================== -->
  <section id="screen-splash" class="screen active">
    <div class="splash-logo">🏋️</div>

    <div>
      <h1 class="display-lg gradient-text" style="text-align:center;">學員教練專區</h1>
      <p class="body-lg color-mute" style="text-align:center; margin-top: 8px;">歡迎來到您的專屬訓練管理面板</p>
    </div>

    <div style="width:100%; max-width: 360px; display:flex; flex-direction:column; gap: 12px;">
      <!-- Google Login Button -->
      <button id="btn-google-login" class="btn btn-primary btn-lg" style="gap:12px; width: 100%;">
        <svg width="20" height="20" viewBox="0 0 48 48" fill="none" style="background:white; border-radius:50%; padding:2px;">
          <path d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 2.9l5.7-5.7C34.5 7.1 29.5 5 24 5 13 5 4 14 4 25s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z" fill="#FFC107"/>
          <path d="M6.3 15.3l6.6 4.8C14.5 17 19 14 24 14c3.1 0 5.8 1.1 7.9 2.9l5.7-5.7C34.5 8.1 29.5 6 24 6 16.3 6 9.7 9.8 6.3 15.3z" fill="#FF3D00"/>
          <path d="M24 44c5.2 0 9.9-1.9 13.5-5.1L31.6 34c-2 1.5-4.6 2.4-7.6 2.4-5.2 0-9.6-3.3-11.2-8H6.4C9.8 36 16.3 44 24 44z" fill="#4CAF50"/>
          <path d="M43.6 20.1H42V20H24v8h11.3c-1.5 4.1-5.3 7-10.3 7-.1 0-.2 0-.3 0l6.7 5c-.4.3 4.7-3.5 8-9.4.7-1.8 1-3.7 1-5.6 0-1.3-.1-2.6-.4-3.9z" fill="#1976D2"/>
        </svg>
        使用 Google 帳號登入
      </button>

      <p class="caption" style="text-align:center; color: var(--c-text-3);">
        請使用與教練約定好的 Google 帳號登入，以查看您的專屬訓練菜單。
      </p>
    </div>
  </section>

  <!-- ==========================================
       MAIN DASHBOARD SCREEN
  =========================================== -->
  <section id="screen-game" class="screen">
    <div class="game-layout" style="grid-template-columns: 300px 1fr; grid-template-rows: 60px 1fr;">

      <!-- Header -->
      <header class="game-header">
        <div class="header-brand">
          <div class="header-brand-icon">🏋️</div>
          NEAT 教練系統
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <div id="header-user" class="caption color-mute"></div>
          <button id="btn-sign-out" class="btn btn-sm btn-ghost">登出</button>
        </div>
      </header>

      <!-- Left: Periodization Goals -->
      <aside class="panel-portfolio">
        <div class="portfolio-net-worth" style="background: hsla(280, 50%, 20%, 0.5);">
          <div class="portfolio-net-worth-label" style="color: #d8b4e2;">🎯 您的核心目標</div>
          <div class="portfolio-net-worth-value" id="goal-long">—</div>
        </div>

        <div class="stats-row" style="grid-template-columns: 1fr; gap: 12px; margin-top: 12px;">
          <div class="stat-cell glass">
            <div class="stat-cell-label" style="color: var(--c-accent);">短期目標</div>
            <div class="stat-cell-value" id="goal-short" style="margin-top: 4px;">—</div>
          </div>
          <div class="stat-cell glass">
            <div class="stat-cell-label" style="color: var(--c-info);">中期目標</div>
            <div class="stat-cell-value" id="goal-mid" style="margin-top: 4px;">—</div>
          </div>
        </div>
        
        <!-- User Info -->
        <div style="margin-top: auto;">
          <div class="caption color-mute">學員資料</div>
          <div class="body" id="user-info-name"></div>
          <div class="body" id="user-info-phone"></div>
        </div>
      </aside>

      <!-- Center: Schedule Feed -->
      <main class="panel-events" id="schedule-feed">
        <!-- JS will inject schedules here -->
      </main>

    </div>
  </section>

  <!-- TOAST CONTAINER -->
  <div id="toast-container"></div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    window.firebase = { initializeApp, getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged };
  </script>

  <!-- Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="data/importedData.js" type="module"></script>
  <script src="js/app.js" type="module"></script>

</div>
</body>
</html>
